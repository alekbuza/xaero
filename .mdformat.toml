# .mdformat.toml

wrap = "keep"
number = true
end_of_line = "lf"
validate = true

# Fail instead of silently skipping a missing plugin
# (without "frontmatter", YAML front matter gets mangled).
extensions = ["gfm", "tables", "frontmatter"]

exclude = [
  "CHANGELOG.md",
  "**/CHANGELOG.md"
]

[plugin.tables]
compact_tables = false
