---
_subdirectory: src
_exclude:
  - "{% if _copier_operation == 'update' -%}src/.gitkeep{% endif %}"
  - "{% if _copier_operation == 'update' -%}bin/.gitkeep{% endif %}"
project_name:
  type: str
  help: project - Project name (PEP 508)
  validator: >-
    {% if not (project_name | regex_search('^([A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9._-]*[A-Za-z0-9])$')) %} Must be a valid PEP 508 name: ASCII letters, digits, '.', '_' and '-', starting and ending with a letter or digit. {% endif %}
project_short_description:
  type: str
  help: project - Project short description
  validator: "{% if not project_short_description | trim %}Must not be empty.{% endif %}"
project_description:
  type: str
  multiline: true
  help: project - Project description
cocogitto_changelog_path:
  type: str
  help: cocogitto:changelog - Path
  default: CHANGELOG.md
cocogitto_changelog_template:
  type: str
  help: cocogitto:changelog - Template
  default: remote
cocogitto_changelog_remote:
  type: str
  help: cocogitto:changelog - Remote
  default: github.com
cocogitto_changelog_owner:
  type: str
  help: cocogitto:changelog - Owner
  validator: "{% if not cocogitto_changelog_owner | trim %}Must not be empty.{% endif %}"
cocogitto_changelog_repository:
  type: str
  help: cocogitto:changelog - Repository
  default: "{{ project_name }}"
  validator: "{% if not cocogitto_changelog_repository | trim %}Must not be empty.{% endif %}"
cocogitto_changelog_authors:
  type: yaml
  help: cocogitto:changelog - Authors
  multiline: true
  default: []
